set default=0
set timeout=8

insmod all_video
insmod gfxterm
insmod png

set gfxmode=1920x1080,1280x720,1024x768,auto
terminal_output gfxterm

set theme_dir=/boot/grub/themes/manifestos
loadfont $theme_dir/manifest-regular-16.pf2
loadfont $theme_dir/manifest-regular-20.pf2
loadfont $theme_dir/manifest-bold-20.pf2
set theme=$theme_dir/theme.txt

menuentry "ManifestOS Live (Turkish)" --class manifestos {
	linux /live/vmlinuz boot=live components quiet splash locales=tr_TR.UTF-8 keyboard-layouts=tr username=manifest user-fullname=Manifest hostname=manifestos
	initrd /live/initrd.img
}

menuentry "ManifestOS Live (English)" --class manifestos {
	linux /live/vmlinuz boot=live components quiet splash locales=en_US.UTF-8 keyboard-layouts=us username=manifest user-fullname=Manifest hostname=manifestos
	initrd /live/initrd.img
}

menuentry "ManifestOS Live (safe graphics)" --class manifestos {
	linux /live/vmlinuz boot=live components nomodeset locales=en_US.UTF-8 keyboard-layouts=us username=manifest user-fullname=Manifest hostname=manifestos
	initrd /live/initrd.img
}
